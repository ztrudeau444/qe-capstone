# Used by the Python and generic scanners. The Java and .NET profiles pass
# these through their own scanner instead.
#
# Fill in the two keys from your SonarQube Cloud project page — Week 0 §4.2.

sonar.projectKey=ztrudeau444_qe-capstone
sonar.organization=ztrudeau444
sonar.host.url=https://sonarcloud.io

sonar.projectName=Quality Engineering Capstone
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src/tests
# src/tests is analysed as tests (sonar.tests), so it must not also be a source.
# src/cpp is the starter's C++ demo; this project uses the Python profile.
sonar.exclusions=**/reports/**,**/node_modules/**,**/target/**,quality/**,src/tests/**,src/cpp/**
# Coverage is measured on the system under test only (profiles/python/test.sh
# runs --cov=src/talkdesk). The framework layers are still analysed for code
# quality, but are not counted as uncovered code.
sonar.coverage.exclusions=src/base/**,src/pages/**,src/utils/**,src/config/**

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.version=3.12

# Coverage on NEW code is the number that changes behaviour. Overall coverage
# on a legacy codebase moves too slowly to be a useful signal.
sonar.newCode.referenceBranch=main
sonar.sourceEncoding=UTF-8
