# Used by the Python and generic scanners. The Java and .NET profiles pass
# these through their own scanner instead.
#
# Fill in the two keys from your SonarQube Cloud project page — Week 0 §4.2.

sonar.projectKey=ztrudeau444_qe-capstone
sonar.organization=ztrudeau444
sonar.host.url=https://sonarcloud.io

sonar.projectName=Quality Engineering Capstone
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src/tests
sonar.exclusions=**/reports/**,**/node_modules/**,**/target/**,quality/**

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.version=3.12

# Coverage on NEW code is the number that changes behaviour. Overall coverage
# on a legacy codebase moves too slowly to be a useful signal.
sonar.newCode.referenceBranch=main
sonar.sourceEncoding=UTF-8
