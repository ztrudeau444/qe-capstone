# The environment the pipeline stands up. `docker compose up -d --wait` blocks
# until every service reports healthy, which is why healthchecks below are not
# optional: without them the load test starts against a service that is still
# booting and you measure your own startup time.

services:
  app:
    build: .
    ports: ['8080:8080']
    environment:
      DB_URL: postgresql://qe:qe@db:5432/qe
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qe
      POSTGRES_PASSWORD: qe
      POSTGRES_DB: qe
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qe']
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      # Test data is disposable. Keeping it in memory makes the suite faster
      # and makes "it passed because of yesterday's data" impossible.
      - /var/lib/postgresql/data
